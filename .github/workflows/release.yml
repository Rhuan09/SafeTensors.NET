name: release
on:
  push:
    tags: ['v*']

jobs:
  # The C ABI is only useful to someone who can download it. Building it here, before
  # anything is published, also means a tag that cannot produce native binaries does not
  # produce a NuGet package either: a release is all of it or none of it.
  native:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: .dll
            asset: safetensors-win-x64.dll
          - os: ubuntu-latest
            rid: linux-x64
            ext: .so
            asset: safetensors-linux-x64.so
          - os: macos-latest
            rid: osx-arm64
            ext: .dylib
            asset: safetensors-osx-arm64.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Native AOT cannot cross-compile, so each binary is built on its own platform.
      # That is also why the matrix is exactly the set of platforms with a runner:
      # anything else would mean shipping a binary nobody built or tested.
      - name: Publish the shared library
        shell: bash
        run: |
          dotnet publish src/SafeTensors.Native \
            --configuration Release \
            -r ${{ matrix.rid }} \
            -p:Version="${GITHUB_REF_NAME#v}" \
            --output ./native

      # Found by extension rather than by name. Whether the toolchain emits
      # safetensors.so or libsafetensors.so is the platform's business and has changed
      # between SDK versions; asserting exactly one match catches a surprise here rather
      # than three steps later as a missing release asset.
      - name: Name the binary for its platform
        shell: bash
        run: |
          ls -l ./native
          matches=$(find ./native -maxdepth 1 -type f -name "*${{ matrix.ext }}")
          count=$(printf '%s' "$matches" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly one *${{ matrix.ext }} in ./native, found $count"
            exit 1
          fi
          cp "$matches" "./native/${{ matrix.asset }}"
          ls -l "./native/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: ./native/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to GitHub Packages with GITHUB_TOKEN
      id-token: write   # request the OIDC token nuget.org trades for a short-lived key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink needs the history to resolve commits

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet test --configuration Release

      # The tag is the source of truth for the version; the VersionPrefix in
      # Directory.Build.props only covers local builds.
      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Packing $VERSION"
          dotnet pack src/SafeTensors.NET \
            --configuration Release \
            -p:Version="$VERSION" \
            --output ./artifacts

      - name: Collect the native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: ./artifacts
          merge-multiple: true

      # The header ships with the binaries. It is the only way to call them, and a
      # consumer should not have to go find the matching revision in the repository.
      - name: Include the C header
        run: cp src/SafeTensors.Native/safetensors.h ./artifacts/

      # Trusted Publishing: nuget.org validates this job's OIDC token against the policy
      # registered for this repository and workflow file, then issues an API key valid for
      # one hour. There is no long-lived secret anywhere in this pipeline.
      #
      # This runs before either push on purpose. If the policy is missing or does not match,
      # the run fails here — with nothing yet published to either feed, rather than to one
      # and not the other.
      - name: Exchange the OIDC token for a NuGet key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # The nuget.org profile name, not an email address. It is public on every package
          # page, so it is not kept as a secret.
          user: rhuan09

      # --no-symbols because the GitHub Packages feed does not accept snupkg.
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --no-symbols \
            --skip-duplicate

      # nuget.org picks up the snupkg alongside the nupkg automatically.
      - name: Push to nuget.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/*.*nupkg
            ./artifacts/safetensors-win-x64.dll
            ./artifacts/safetensors-linux-x64.so
            ./artifacts/safetensors-osx-arm64.dylib
            ./artifacts/safetensors.h
          # A missing binary should be loud. A release that silently lacks one platform
          # is worse than a run that fails.
          fail_on_unmatched_files: true
          generate_release_notes: true
          # A SemVer prerelease has a hyphen in it, and nothing else does. Without this
          # the action defaults to false and a preview shows up as "Latest release" on
          # the repository page, which is exactly the wrong thing to point people at.
          prerelease: ${{ contains(github.ref_name, '-') }}
